# =====================================================================================
# AI Risk Score Card - CONVENTIONAL BANK - Layer 2: BANK POLICY
# Tenant: demo_conventional_bank   |   Policy version: 0.1 (draft)   |   Effective: 2026-11-09
# Source of truth: credit-policy-uae-conventional/03-parameter-sheet.md
# Credit criteria are IDENTICAL to the recommended Islamic policy; only structures, pricing
# language, fees and insurance are converted to conventional practice.
#
# Tags:
#   I  = carried over from the recommended Islamic policy (credit criterion unchanged)
#   C  = CBUAE rule (reference only; the CBUAE layer is the authority)
#   M  = top-five CONVENTIONAL median (ENBD, FAB, ADCB, Mashreq, RAKBANK)
#   P  = proposed (no published market figure)
#   CV = converted to conventional practice
# The 8 items that were [A] (adjusted, needs sign-off) in the Islamic policy keep the same
# values here and remain subject to the same management sign-off.
#
# VOCABULARY NOTE: the UAE edition of AI Risk Score Card is Islamic-vocabulary-only in v1
# (PRD decision B1b; AD-12 lint bans conventional terms). Loading this conventional config
# needs a conventional tenant profile / vocabulary switch, as in AI Risk Score Card Global.
# Vocabulary used here: loan_amount, interest_rate, loan_application, borrower, mortgage,
# pledge / lien, insurance.
# Tighten-only: nothing here may be looser than config/regulators/cbuae.yaml (AD-3).
# =====================================================================================

meta:
  tenant: demo_conventional_bank
  layer: bank_policy
  version: "0.1"
  status: draft
  effective_date: "2026-11-09"
  currency: AED
  parameter_sheet: credit-policy-uae-conventional/03-parameter-sheet.md
  islamic_source_policy: credit-policy-uae/03-parameter-sheet.md
  benchmark_set: [emirates_nbd_conventional, fab, adcb, mashreq, rakbank]
  maker_checker_required: true
  vocabulary_profile: conventional               # requires conventional tenant profile (see header)

# -------------------------------------------------------------------------------------
# 1. Eligibility
# -------------------------------------------------------------------------------------
eligibility:
  customer_groups:                                   # P-01 [I]
    uae_national: eligible
    expat_resident: eligible
    non_resident: excluded_v1                        # P-01 / P-42 [I]
  nationality_exclusions: none                       # P-09 [I] sanctions screening only
  sanctions_screening_required: true                 # P-09 [I]

  age:                                               # P-02, P-03
    min_age_years: 21                                # P-02 [I] (market median 21)
    max_age_at_maturity:                             # P-03 [I]
      personal_loan:      {uae_national: 65, expat: 60}
      credit_card:        {uae_national: 65, expat: 60}
      auto_loan:          {uae_national: 65, expat: 60}
      salary_advance:     {uae_national: 65, expat: 60}
      eosb_backed:        {uae_national: 65, expat: 60}
      home_loan:          {uae_national: 70, expat_salaried: 65, self_employed: 70}
      retiree_pension_loan: {uae_national: 70}
      deposit_backed:     {uae_national: 70, expat: 70}   # [I] secured by deposit lien
      gold_backed:        {uae_national: 70, expat: 70}   # [I] secured by gold pledge

  minimum_service_months:                            # P-04 [I]
    salary_assigned: 3
    unsecured_non_stl: 6
    home_loan: 6
    home_loan_probation_completed: true
    auto_loan: 3
    credit_card: 3
    salary_advance: 3
    eosb_backed_min_service_years: 3                 # P-53 [I]

  minimum_monthly_gross_income_aed:                  # product minimums live in credit_policy.yaml
    default: 5000                                    # [I]

# -------------------------------------------------------------------------------------
# 2. Repayment tracks (P-05)
# -------------------------------------------------------------------------------------
tracks:
  salary_assigned:                                   # secured / quasi-secured track [I]
    description: "Employer salary transfer letter (bank format) + irrevocable end-of-service (EOS) undertaking; salary credited via WPS."
    required_security:
      - employer_salary_transfer_letter_bank_format  # P-19 [I]
      - irrevocable_eos_undertaking                  # P-19 [I]
      - wps_salary_credit_verified                   # P-19 [I]
      - undated_security_cheque_subject_to_legal_advice   # P-19 [M] optional per legal
    salary_not_credited_rate_step_up:                # P-19 [I] (RAKBANK practice)
      consecutive_months_without_salary: 3
      interest_rate_step_up_pct_pa: 2.0
  unsecured_non_stl:                                 # no salary transfer [I]
    description: "No salary transfer; repayment by UAE direct debit (UAEDDS) from the salary account at another bank."
    repayment_mechanism: uae_direct_debit_uaedds     # P-23 [I]
    statements_months_required: 12                   # P-10 [I]
    min_service_months: 6                            # P-04 [I]

# -------------------------------------------------------------------------------------
# 3. Employer categories (P-06) - all accepted, tiered [I]
# -------------------------------------------------------------------------------------
employer_categories:
  A:
    label: "Government, semi-government, Ministry of Defence (MoD), Armed Forces (AF)"
    accepted: true
  B:
    label: "Listed large private employers (bank approved list, large corporates / blue-chip)"
    accepted: true
  C:
    label: "Other listed private employers (bank approved list)"
    accepted: true
  D:
    label: "Non-listed / unrated employers"
    accepted: true
    personal_loan_salary_assigned_max_aed: 500000    # P-13 [I]
    unsecured_non_stl_min_income_aed: 10000          # P-21 [I]
  starter_list_owner: credit_risk                    # bank maintains lists; unknown employers default to D

# -------------------------------------------------------------------------------------
# 4. Credit bureau (AECB) floors and knock-outs (P-08) [I]
# -------------------------------------------------------------------------------------
aecb:
  score_range: [300, 900]
  min_score:
    personal_loan_salary_assigned: {uae_national: 500, expat: 541}
    personal_loan_unsecured: 600
    personal_loan_unsecured_cat_d_or_low_score_band: 541   # with min income 10,000 (P-21)
    credit_card: 541
    home_loan: 541
    auto_loan: 541
    salary_advance: 541
    eosb_backed: 541
    deposit_backed: null                             # no floor; refer if < 541
    deposit_backed_refer_below: 541
    gold_backed: 541
  knock_outs:
    current_dpd_ge: 30                               # any facility currently 30+ days past due
    dpd_90_plus_in_last_months: 24
    writeoff_or_settlement_in_last_months: 24
  refer_triggers:
    aecb_enquiries_in_30_days_gt: 6
  consent_required: true

# -------------------------------------------------------------------------------------
# 5. Sector watch-list (P-09) [I] - lower caps, never blanket bans
# -------------------------------------------------------------------------------------
sector_watch_list:
  mechanism: "Credit Risk maintains a list of employer sectors under stress (e.g. hospitality, travel, real estate in a downturn). Listed sectors get lower caps and Refer, not exclusion."
  default_cap_reduction_pct: 25
  severity: refer
  sectors: []                                        # populated by Credit Risk via maker-checker

# -------------------------------------------------------------------------------------
# 6. Documents and verification (P-10, P-11)
# -------------------------------------------------------------------------------------
documents:
  common: [emirates_id, passport_and_residence_visa, aecb_consent, signed_application_and_kfs_acknowledgement]
  salary_assigned:
    - salary_certificate_or_stl_bank_format
    - irrevocable_eos_undertaking
    - bank_statements_3_months_or_uaefts_consent    # [I] market practice for salary-transfer customers
  unsecured_non_stl:
    - salary_certificate
    - bank_statements_12_months                     # [I]
    - uaedds_direct_debit_mandate
  self_employed:
    - trade_licence
    - memorandum_of_association
    - bank_statements_12_months                     # [I]
    - audited_financials_2_years_for_home_loan      # [I]
    - financials_if_available_other_products        # [I]
  personal_loan_additional: [credit_life_insurance_enrolment]          # P-20a [CV]
  home_loan_additional: [title_deed_or_spa, valuation_report, life_insurance_assignment, property_insurance_assignment]   # P-40 [CV]
  auto_loan_additional: [dealer_quotation_or_approved_valuation, comprehensive_motor_insurance]   # P-50 [CV]

self_employed:                                       # P-11 [I]
  min_trade_licence_years:
    personal_loan: 2
    auto_loan: 2
    credit_card: 2
    home_loan: 3
  min_average_monthly_balance_aed:
    personal_loan: 20000
    auto_loan: 15000
    credit_card_3m_average: 50000                    # P-30 [I]
  income_basis: "12 months credit turnover adjusted for business margin, and audited accounts where available"
  personal_loan_max_aed: 500000
  home_loan_audited_financials_years: 2

# -------------------------------------------------------------------------------------
# 7. Affordability (reference to CBUAE layer; P-07)
# -------------------------------------------------------------------------------------
affordability:
  dbr_income_basis: gross_salary_plus_regular_income # [C]
  dbr_max_pct: 50                                    # [C] reference = cbuae.retail.dbr.max_pct_gross_income
  dbr_max_pct_retiree: 30                            # [C]
  dbr_max_pct_government_housing_programme: 60       # [C] P-41
  card_obligation_pct_of_limit: 5                    # [P] market convention
  overdraft_obligation_pct_of_limit: 5               # [P] deposit-backed overdrafts counted like cards
  basic_plus_housing_dbr_reported_as_indicator: true # [I] risk indicator only, not a gate

# -------------------------------------------------------------------------------------
# 8. Delegation of authority (§9 / §10) [I]
# -------------------------------------------------------------------------------------
delegation_of_authority:
  - authority: credit_officer
    unsecured_total_max_aed: 250000
    home_loan_max_aed: 3000000
    max_grade: 6
    deviations: none
  - authority: senior_credit_officer
    unsecured_total_max_aed: 1000000
    home_loan_max_aed: 7500000
    max_grade: 6
    deviations: {scope: bank_policy_items, max_grade: 4}
  - authority: head_of_retail_credit
    unsecured_total_max_aed: 4000000
    home_loan_max_aed: 15000000
    max_grade: 6
    deviations: {scope: bank_policy_items, max_grade: 6}
  - authority: chief_risk_officer
    unsecured_total_max_aed: null                    # above Head of Retail Credit limits
    home_loan_max_aed: 20000000
    max_grade: 8
    deviations: {scope: grade_7_8_cases, max_grade: 8}
  - authority: credit_committee
    unsecured_total_max_aed: null
    home_loan_max_aed: null                          # above AED 20m and policy exceptions
    max_grade: 8
    deviations: {scope: policy_exceptions, max_grade: 8}

deviation_rules:
  cbuae_rules_deviable: false                        # CBUAE can never be deviated
  grades_9_10_approvable: false
  by_grade:
    "1-3": {deviation_possible: true,  min_authority: senior_credit_officer}
    "4":   {deviation_possible: true,  min_authority: senior_credit_officer}
    "5-6": {deviation_possible: true,  min_authority: head_of_retail_credit}
    "7-8": {deviation_possible: true,  min_authority: chief_risk_officer}
    "9-10": {deviation_possible: false, min_authority: null}
  record_reason_and_approver: true

decision_bands:                                      # §9 (model escalation; policy always wins)
  approve_grades: [1, 2, 3, 4, 5, 6]
  refer_grades: [7, 8]
  decline_grades: [9, 10]
  never_auto_decline: true
