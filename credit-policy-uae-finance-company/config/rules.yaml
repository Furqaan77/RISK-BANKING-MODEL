# =====================================================================================
# AI Risk Score Card - PILOT FINANCE COMPANY (conventional) - executable rules (AD-3 format)
# Tenant: demo_finance_company   |   Version 0.1 (draft)   |   Effective 2026-11-09
#
# Each rule: id, layer, applies_to, condition (PASS when true; safe DSL: comparisons,
# arithmetic, and/or/not, `in` with a literal list, min(), max(), conditional expressions;
# no inline lookup tables), severity, message, source (parameter-sheet ID + tag), confidence,
# and, for numeric limits, direction (max | min) + limit.
#
# Three blocks:
#   regulatory_baseline  Layer 1 values (CBUAE consumer rules + FCR). Tighten-only anchor.
#   prudential_rules     Company-level checks on a balance-sheet / portfolio snapshot:
#                          PRU.FCR.* = Layer 1 (FCR)   PRU.CO.* and PORT.* = Layer 2 (company)
#                          scope pre_approval   -> run on every application with the snapshot
#                          scope portfolio_*    -> run daily / monthly on the book
#   rules                Customer-level checks on each application:
#                          REG.*    = Layer 1 (CBUAE / FCR)
#                          CO.RET.* = Layer 2 (company policy)
#                          CRED.*   = Layer 3 (credit policy, per product)
#
# Severity (customer level): knockout = Decline; refer = at most Refer; warn = note only.
# Severity (portfolio scope): knockout = HOLD new disbursements of the products in applies_to
#   (affected applications cannot be approved); refer = management action by the named owner
#   (does not change individual decisions); warn = report only.
#
# Source tags: B bank criterion | C CBUAE | R FCR | A adjusted (sign-off) | P proposal (sign-off)
# In the product, Layer 1 lives in config/regulators/ (cbuae.yaml + fcr.yaml); it is repeated
# here so the demo pack is self-contained and validate_config.py can prove tighten-only.
# =====================================================================================

meta:
  tenant: demo_finance_company
  version: "0.1"
  effective_date: "2026-11-09"
  parameter_sheet: credit-policy-uae-finance-company/03-parameter-sheet.md
  condition_semantics: pass_when_true
  vocabulary_profile: conventional

# -------------------------------------------------------------------------------------
# Layer 1 baseline: CBUAE + FCR values (confidence M where read from search extracts)
# -------------------------------------------------------------------------------------
regulatory_baseline:
  cbuae:
    personal_loan_income_multiple_max: 20         # Reg 29/2011 Art 2(b)
    personal_loan_tenor_months_max: 48            # Reg 29/2011 Art 2(c)
    dbr_max_pct: 50                               # Reg 29/2011 Art 7(a)
    dbr_retiree_max_pct: 30                       # Reg 29/2011 Art 7(b)
    auto_ltv_max_pct: 80                          # Reg 29/2011 Art 3(b)
    auto_tenor_months_max: 60                     # Reg 29/2011 Art 3(c)
    top_up_clean_repayment_months_min: 12         # Reg 29/2011 Art 6(g)
    credit_card_min_annual_income_aed: 60000      # Reg 29/2011
    early_settlement_fee: {pct: 1.0, max_aed: 10000}   # Res. 96/2019
    processing_fee: {pct: 1.0, min_aed: 500, max_aed: 2500}
    late_fee_max_aed: {personal: 200, auto: 500, card: 230, home: 700}
    deferment_fee_max_aed: 100
    rescheduling_fee_max_aed: 250
    security_cheque_max_pct_of_loan: 120          # Consumer Protection Standards
    cooling_off_business_days_min: 5
    disbursement_business_days_max: 10
    rescheduling_beyond_48_months: "only if dbr > 50 and no new money"
  fcr:
    capital_min_aed: 150000000                    # FCR C 3/2023
    leverage_max_pct_of_capital_funds_years_0_2: 100
    liquid_assets_min_pct_of_liabilities: 10
    single_borrower_max_pct: 10
    connected_group_max_pct: 15
    large_exposure_threshold_pct: 7
    principal_shareholder_single_max_pct: 10
    principal_shareholder_aggregate_max_pct: 20
    board_member_lending_allowed: false
    individual_deposits_allowed: false
    islamic_window_allowed: false
    product_line_no_objection_letter_required: true
    aecb_report_before_every_credit: true
    short_term_credit:                            # FCR Part II caps; policy applies them to salary advance and BNPL
      max_amount_aed: 20000
      max_multiple_of_net_monthly_income: 3
      max_tenor_months: 12
      interest_allowed: false
      total_fees_max_pct: 30
      bureau_check_required_from_aed: 5000

cbuae_references:
  - {ref: CBUAE.RET.PF.MULTIPLE, value: 20, direction: max, unit: x_monthly_income, source: "Reg 29/2011 Art 2(b)", confidence: H, used_by: [CRED.PEA.002, CRED.PNA.002, CRED.EOS.003]}
  - {ref: CBUAE.RET.PF.TENOR, value: 48, direction: max, unit: months, source: "Reg 29/2011 Art 2(c)", confidence: H, used_by: [CRED.PEA.003, CRED.PNA.003, CRED.EOS.003, CRED.RS.001]}
  - {ref: CBUAE.RET.DBR, value: 50, direction: max, unit: pct_gross_income, source: "Reg 29/2011 Art 7(a)", confidence: H, used_by: [REG.CB.001]}
  - {ref: CBUAE.RET.DBR.RETIREE, value: 30, direction: max, unit: pct_pension, source: "Reg 29/2011 Art 7(b)", confidence: H, used_by: [REG.CB.001]}
  - {ref: CBUAE.RET.TOPUP.CLEAN, value: 12, direction: min, unit: months, source: "Reg 29/2011 Art 6(g)", confidence: H, used_by: [CRED.TU.001]}
  - {ref: CBUAE.AUTO.LTV, value: 80, direction: max, unit: pct_vehicle_value, source: "Reg 29/2011 Art 3(b)", confidence: H, used_by: [CRED.AL.002]}
  - {ref: CBUAE.AUTO.TENOR, value: 60, direction: max, unit: months, source: "Reg 29/2011 Art 3(c)", confidence: H, used_by: [CRED.AL.003]}
  - {ref: CBUAE.CC.MIN_INCOME, value: 60000, direction: min, unit: aed_per_year, source: "Reg 29/2011", confidence: M, used_by: [REG.CB.002]}
  - {ref: CBUAE.FEES, value: "Res. 96/2019 caps", direction: max, source: "Res. 96/2019 / Appendix 2", confidence: M, used_by: [REG.CB.003, REG.CB.004, REG.CB.005, REG.CB.006, REG.CB.007, REG.CB.008, REG.CB.009]}
  - {ref: FCR.STC, value: "AED 20k / 3x net / 12m / no interest / fees 30%", direction: max, source: "FCR C 3/2023 Part II", confidence: M, used_by: [REG.STC.001, REG.STC.002, REG.STC.003, REG.STC.004, REG.STC.005]}

# =====================================================================================
# PRUDENTIAL AND PORTFOLIO RULES (company-level snapshot)
# Snapshot variables: capital_funds, total_liabilities, liquid_assets, gross_retail_loans,
# borrower_total_exposure, connected_group_exposure, customer_total_exposure,
# related_party_single_exposure, related_party_aggregate_exposure, individual_deposit_accounts,
# share_* ratios (in %). Application variables used here: loan_amount, is_board_member,
# is_principal_shareholder_or_affiliate, is_related_party.
# =====================================================================================
prudential_rules:

  # ---------------- Layer 1: FCR ----------------
  - id: PRU.FCR.001
    layer: regulatory
    scope: portfolio_daily
    applies_to: {products: all}
    condition: "capital_funds >= 150000000"
    severity: knockout
    direction: min
    limit: 150000000
    message: "Capital funds below the FCR minimum of AED 150m: hold all new lending."
    source: "F-02 [R]"
    confidence: M

  - id: PRU.FCR.002
    layer: regulatory
    scope: portfolio_daily
    applies_to: {products: all}
    condition: "total_liabilities <= 1.00 * capital_funds"
    severity: knockout
    direction: max
    limit: 100
    message: "Leverage: liabilities above 100% of capital funds (licence years 0-2): hold new disbursements."
    source: "F-02 [R]"
    confidence: M

  - id: PRU.FCR.003
    layer: regulatory
    scope: portfolio_daily
    applies_to: {products: all}
    condition: "liquid_assets >= 0.10 * total_liabilities"
    severity: knockout
    direction: min
    limit: 10
    message: "Liquid assets below 10% of liabilities (FCR): hold new disbursements."
    source: "F-06 [R]"
    confidence: M

  - id: PRU.FCR.004
    layer: regulatory
    scope: pre_approval
    applies_to: {products: all}
    condition: "borrower_total_exposure + loan_amount <= 0.10 * capital_funds"
    severity: knockout
    direction: max
    limit: 10
    message: "Single-borrower exposure would exceed 10% of capital funds (AED 15m)."
    source: "F-03 [R]"
    confidence: M

  - id: PRU.FCR.005
    layer: regulatory
    scope: pre_approval
    applies_to: {products: all}
    condition: "connected_group_exposure + loan_amount <= 0.15 * capital_funds"
    severity: knockout
    direction: max
    limit: 15
    message: "Connected-group exposure would exceed 15% of capital funds (AED 22.5m)."
    source: "F-03 [R]"
    confidence: M

  - id: PRU.FCR.006
    layer: regulatory
    scope: pre_approval
    applies_to: {products: all}
    condition: "borrower_total_exposure + loan_amount < 0.07 * capital_funds"
    severity: warn
    direction: max
    limit: 7
    message: "Large exposure (>= 7% of capital funds, AED 10.5m): report as a large exposure."
    source: "F-03 [R]"
    confidence: M

  - id: PRU.FCR.007
    layer: regulatory
    scope: pre_approval
    applies_to: {products: all}
    condition: "is_board_member == False"
    severity: knockout
    message: "No lending to board members (FCR)."
    source: "F-04 [R]"
    confidence: H

  - id: PRU.FCR.008
    layer: regulatory
    scope: pre_approval
    applies_to: {products: all}
    condition: "is_principal_shareholder_or_affiliate == False or related_party_single_exposure + loan_amount <= 0.10 * capital_funds"
    severity: knockout
    direction: max
    limit: 10
    message: "Principal shareholder / affiliate exposure would exceed 10% of capital funds."
    source: "F-04 [R]"
    confidence: M

  - id: PRU.FCR.009
    layer: regulatory
    scope: pre_approval
    applies_to: {products: all}
    condition: "is_principal_shareholder_or_affiliate == False or related_party_aggregate_exposure + loan_amount <= 0.20 * capital_funds"
    severity: knockout
    direction: max
    limit: 20
    message: "Aggregate principal shareholder / affiliate exposure would exceed 20% of capital funds."
    source: "F-04 [R]"
    confidence: M

  - id: PRU.FCR.010
    layer: regulatory
    scope: portfolio_daily
    applies_to: {products: all}
    condition: "individual_deposit_accounts == 0"
    severity: knockout
    message: "Deposits or accounts held for individuals: not permitted for a finance company."
    source: "F-05 [R]"
    confidence: H

  # ---------------- Layer 2: company prudential ----------------
  - id: PRU.CO.001
    layer: company_policy
    scope: pre_approval
    applies_to: {products: all}
    condition: "gross_retail_loans + loan_amount <= 250000000"
    severity: knockout
    direction: max
    limit: 250000000
    message: "Pilot book cap: gross retail loans would exceed AED 250m (years 0-2). Renewals only; Board review."
    source: "F-02 [P]"
    confidence: M

  - id: PRU.CO.002
    layer: company_policy
    scope: portfolio_daily
    applies_to: {products: all}
    condition: "total_liabilities < 0.85 * capital_funds"
    severity: refer
    direction: max
    limit: 85
    message: "Leverage early warning: liabilities at 85% of the legal limit. Treasury and Head of Credit slow disbursements; report to Board."
    source: "F-02 [P]"
    confidence: M

  - id: PRU.CO.003
    layer: company_policy
    scope: portfolio_daily
    applies_to: {products: all}
    condition: "liquid_assets >= 0.12 * total_liabilities"
    severity: knockout
    direction: min
    limit: 12
    message: "Liquid assets below the 12% internal trigger: hold new disbursements."
    source: "F-06 [P]"
    confidence: M

  - id: PRU.CO.004
    layer: company_policy
    scope: pre_approval
    applies_to: {products: all}
    condition: "customer_total_exposure + loan_amount <= 1000000"
    severity: refer
    direction: max
    limit: 1000000
    message: "Internal cap per individual (all products) AED 1m exceeded: Board Credit Committee exception only."
    source: "F-03 [P]"
    confidence: M

  - id: PRU.CO.005
    layer: company_policy
    scope: pre_approval
    applies_to: {products: all}
    condition: "is_related_party == False"
    severity: refer
    message: "Related-party applicant: Board Credit Committee approval required."
    source: "F-04 [R] / policy 4.2"
    confidence: H

  # ---------------- Layer 2: portfolio limits (section 15) ----------------
  - id: PORT.001
    layer: company_policy
    scope: portfolio_monthly
    applies_to: {products: [personal_loan_non_assigned]}
    condition: "share_non_assigned_of_pl_book_pct <= 35"
    severity: refer
    direction: max
    limit: 35
    action: "Raise the non-assigned AECB floor to 600."
    owner: chief_risk_officer
    message: "Non-assigned loans above 35% of the personal-loan book."
    source: "F-58 [P]"
    confidence: L

  - id: PORT.002
    layer: company_policy
    scope: portfolio_monthly
    applies_to: {products: [personal_loan_employer_assigned, personal_loan_non_assigned]}
    condition: "share_category_d_of_pl_book_pct <= 25"
    severity: refer
    direction: max
    limit: 25
    action: "Cap new category D approvals."
    owner: chief_risk_officer
    message: "Category D employer exposure above 25% of the personal-loan book."
    source: "F-58 [P]"
    confidence: L

  - id: PORT.003
    layer: company_policy
    scope: portfolio_monthly
    applies_to: {products: [personal_loan_employer_assigned]}
    condition: "share_max_single_employer_of_assigned_book_pct <= 5"
    severity: refer
    direction: max
    limit: 5
    action: "Credit Committee review of the employer."
    owner: board_credit_committee
    message: "One employer above 5% of the employer-assigned book."
    source: "F-58 [P]"
    confidence: L

  - id: PORT.004
    layer: company_policy
    scope: portfolio_monthly
    applies_to: {products: [gold_backed]}
    condition: "share_gold_of_retail_book_pct <= 5"
    severity: knockout
    direction: max
    limit: 5
    action: "Stop new gold lending."
    owner: head_of_credit
    message: "Gold-backed loans above 5% of the retail book: new gold lending held."
    source: "F-58 [P]"
    confidence: L

  - id: PORT.005
    layer: company_policy
    scope: portfolio_monthly
    applies_to: {products: [salary_advance, bnpl]}
    condition: "share_salary_advance_bnpl_of_retail_book_pct <= 2"
    severity: knockout
    direction: max
    limit: 2
    action: "Pause new salary advances and BNPL plans."
    owner: head_of_credit
    message: "Salary advance + BNPL above 2% of the retail book: new advances and plans held."
    source: "F-58 [P]"
    confidence: L

  - id: PORT.006
    layer: company_policy
    scope: portfolio_monthly
    applies_to: {products: all}
    condition: "share_aecb_541_599_of_monthly_approvals_pct <= 25"
    severity: refer
    direction: max
    limit: 25
    action: "Raise AECB floors by 20 points."
    owner: chief_risk_officer
    message: "Approvals with AECB 541-599 above 25% of monthly approvals."
    source: "F-58 [P]"
    confidence: L

  - id: PORT.007
    layer: company_policy
    scope: portfolio_monthly
    applies_to: {products: all}
    condition: "share_deviations_of_monthly_approvals_pct <= 5"
    severity: refer
    direction: max
    limit: 5
    action: "CRO review of deviations."
    owner: chief_risk_officer
    message: "Approvals with deviations above 5% a month."
    source: "F-58 [P]"
    confidence: L

# =====================================================================================
# CUSTOMER-LEVEL RULES
# =====================================================================================
rules:

  # ---------------- Layer 1: CBUAE consumer rules ----------------
  - id: REG.CB.001
    layer: regulatory
    applies_to: {products: all}
    condition: "dbr_after <= (30 if is_retiree else 50)"
    severity: knockout
    direction: max
    limit: {default: 50, retiree: 30}
    message: "Debt burden ratio above the CBUAE limit (50%; 30% past retirement age). Cards at 5% of limit and BNPL instalments counted."
    source: "F-15 [C] [R] -> CBUAE.RET.DBR"
    confidence: H

  - id: REG.CB.002
    layer: regulatory
    applies_to: {products: [credit_card]}
    condition: "12 * monthly_gross_income >= 60000"
    severity: knockout
    direction: min
    limit: 60000
    message: "Credit card: annual income below the CBUAE minimum of AED 60,000."
    source: "F-37 [C] -> CBUAE.CC.MIN_INCOME"
    confidence: M

  - id: REG.CB.003
    layer: regulatory
    applies_to: {products: [personal_loan_employer_assigned, personal_loan_non_assigned, auto_loan, gold_backed]}
    condition: "early_settlement_fee_aed <= min(0.01 * amount_settled, 10000)"
    severity: knockout
    direction: max
    limit: {pct: 1, max_aed: 10000}
    message: "Early-settlement fee above 1% of the amount settled (max AED 10,000)."
    source: "F-25 [C] -> CBUAE.FEES"
    confidence: M

  - id: REG.CB.004
    layer: regulatory
    applies_to: {products: [personal_loan_employer_assigned, personal_loan_non_assigned, auto_loan, gold_backed]}
    condition: "processing_fee_aed <= min(max(0.01 * loan_amount, 500), 2500)"
    severity: knockout
    direction: max
    limit: {pct: 1, min_aed: 500, max_aed: 2500}
    message: "Processing fee above 1% (min AED 500, max AED 2,500)."
    source: "F-24 [C] -> CBUAE.FEES"
    confidence: M

  - id: REG.CB.005
    layer: regulatory
    applies_to: {products: [personal_loan_employer_assigned, personal_loan_non_assigned, gold_backed]}
    condition: "late_payment_fee_aed <= 200"
    severity: knockout
    direction: max
    limit: 200
    message: "Personal-loan late fee above the CBUAE cap of AED 200."
    source: "F-26 [C] -> CBUAE.FEES"
    confidence: M

  - id: REG.CB.006
    layer: regulatory
    applies_to: {products: [auto_loan]}
    condition: "late_payment_fee_aed <= 500"
    severity: knockout
    direction: max
    limit: 500
    message: "Auto-loan late fee above the CBUAE cap of AED 500."
    source: "F-48 [C] -> CBUAE.FEES"
    confidence: M

  - id: REG.CB.007
    layer: regulatory
    applies_to: {products: [credit_card]}
    condition: "late_payment_fee_aed <= 230"
    severity: knockout
    direction: max
    limit: 230
    message: "Card late fee above the CBUAE cap of AED 230."
    source: "F-39 [C] -> CBUAE.FEES"
    confidence: M

  - id: REG.CB.008
    layer: regulatory
    applies_to: {products: [rescheduling]}
    condition: "deferment_fee_aed <= 100"
    severity: knockout
    direction: max
    limit: 100
    message: "Deferment fee above AED 100."
    source: "F-36 [C] -> CBUAE.FEES"
    confidence: M

  - id: REG.CB.009
    layer: regulatory
    applies_to: {products: [rescheduling]}
    condition: "rescheduling_fee_aed <= 250"
    severity: knockout
    direction: max
    limit: 250
    message: "Rescheduling fee above AED 250."
    source: "F-36 [C] -> CBUAE.FEES"
    confidence: M

  - id: REG.CB.010
    layer: regulatory
    applies_to: {products: [personal_loan_employer_assigned, personal_loan_non_assigned, auto_loan]}
    condition: "security_cheque_blank == False and security_cheque_pct_of_loan <= 120"
    severity: knockout
    direction: max
    limit: 120
    message: "Security cheque above 120% of the loan, or blank."
    source: "F-27 / F-33 / F-59 [C] [R]"
    confidence: H

  - id: REG.CB.011
    layer: regulatory
    applies_to: {products: all}
    condition: "kfs_signed_before_contract == True and (cooling_off_business_days >= 5 or cooling_off_waived_in_writing == True)"
    severity: knockout
    message: "KFS (with APR) must be signed before the contract; 5-business-day cooling-off unless waived in writing."
    source: "F-59 [C]"
    confidence: H

  - id: REG.CB.012
    layer: regulatory
    applies_to: {products: all}
    condition: "affordability_summary_signed == True"
    severity: knockout
    message: "Signed affordability summary required in every file."
    source: "F-15 [C]"
    confidence: H

  # ---------------- Layer 1: FCR (customer level) ----------------
  - id: REG.FCR.001
    layer: regulatory
    applies_to: {products: all}
    condition: "aecb_report_pulled == True"
    severity: knockout
    message: "AECB report (with consent) required before every retail credit, any amount."
    source: "F-08 [R]"
    confidence: H

  - id: REG.FCR.002
    layer: regulatory
    applies_to: {products: all}
    condition: "product_cbuae_nol_received == True"
    severity: knockout
    message: "Product line has no CBUAE no-objection letter on file."
    source: "F-01 [R]"
    confidence: H

  - id: REG.FCR.003
    layer: regulatory
    applies_to: {products: all}
    condition: "facility_type != 'overdraft' and secured_by_customer_deposit == False and contract_structure != 'islamic'"
    severity: knockout
    message: "Not permitted for a finance company: overdrafts, deposit-backed lending, Islamic-window contracts."
    source: "F-01 / F-05 / F-54 [R]"
    confidence: H

  # ---------------- Layer 1: FCR short-term credit caps (salary advance, BNPL) ----------------
  - id: REG.STC.001
    layer: regulatory
    applies_to: {products: [salary_advance, bnpl]}
    condition: "loan_amount <= min(20000, 3 * net_monthly_income)"
    severity: knockout
    direction: max
    limit: {max_aed: 20000, net_income_multiple: 3}
    message: "Short-term credit above the lower of AED 20,000 or 3 months' net income."
    source: "F-52 / F-53 [R] -> FCR.STC"
    confidence: M

  - id: REG.STC.002
    layer: regulatory
    applies_to: {products: [salary_advance, bnpl]}
    condition: "term_days <= 365"
    severity: knockout
    direction: max
    limit: 12
    message: "Short-term credit longer than 12 months."
    source: "F-52 / F-53 [R] -> FCR.STC"
    confidence: M

  - id: REG.STC.003
    layer: regulatory
    applies_to: {products: [salary_advance, bnpl]}
    condition: "interest_rate_pct == 0"
    severity: knockout
    message: "Short-term credit may not charge interest."
    source: "F-52 / F-53 [R] -> FCR.STC"
    confidence: M

  - id: REG.STC.004
    layer: regulatory
    applies_to: {products: [salary_advance, bnpl]}
    condition: "total_fees_aed <= 0.30 * loan_amount"
    severity: knockout
    direction: max
    limit: 30
    message: "Short-term credit: total fees (including late fees) above 30% of the credit."
    source: "F-52 / F-53 [R] -> FCR.STC"
    confidence: M

  - id: REG.STC.005
    layer: regulatory
    applies_to: {products: [salary_advance, bnpl]}
    condition: "loan_amount < 5000 or aecb_report_pulled == True"
    severity: knockout
    message: "Short-term credit of AED 5,000 or more needs a bureau check (the Company checks every credit: REG.FCR.001)."
    source: "F-53 [R] -> FCR.STC"
    confidence: M

  # ---------------- Layer 2: company policy (all products) ----------------
  - id: CO.RET.000
    layer: company_policy
    applies_to: {products: all}
    condition: "product_offered_in_pilot == True"
    severity: knockout
    message: "Product not offered in the pilot (BNPL and home finance are phase 2; deposit-backed lending is not permitted)."
    source: "F-01 / F-53 / F-54 / F-55 [A] [R]"
    confidence: H

  - id: CO.RET.001
    layer: company_policy
    applies_to: {products: all}
    condition: "nationality_group in ['uae_national', 'expat'] and residency_status == 'resident'"
    severity: knockout
    message: "Only UAE nationals and UAE-resident expats are eligible (non-residents out of scope)."
    source: "F-09 [B]"
    confidence: H

  - id: CO.RET.002
    layer: company_policy
    applies_to: {products: all}
    condition: "sanctions_hit == False"
    severity: knockout
    message: "Sanctions screening hit."
