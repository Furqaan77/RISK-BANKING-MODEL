    applies_to: {products: [personal_loan_employer_assigned], uses_eosb_security: true}
    condition: "track == 'employer_assigned' and eos_undertaking_received == True and eos_legal_opinion_ok == True"
    severity: knockout
    message: "EOSB security only inside an employer-assigned loan with an irrevocable undertaking and a legal opinion."
    source: "F-51 [B] / policy 8.7 [A]"
    confidence: M

  - id: CRED.EOS.002
    layer: credit_policy
    applies_to: {products: [personal_loan_employer_assigned], uses_eosb_security: true}
    condition: "eosb_service_years >= 3 and loan_amount_against_eosb <= 0.80 * eosb_accrued"
    severity: knockout
    message: "EOSB-backed portion above 80% of accrued EOSB, or service below 3 years."
    source: "F-51 [B]"
    confidence: L

  - id: CRED.EOS.003
    layer: credit_policy
    applies_to: {products: [personal_loan_employer_assigned], uses_eosb_security: true}
    condition: "total_personal_loans <= 20 * monthly_gross_income and tenor_months <= 48"
    severity: knockout
    message: "Total personal lending including the EOSB-backed portion must stay within 20x income and 48 months."
    source: "F-51 [C] -> CBUAE.RET.PF.MULTIPLE"
    confidence: H

  # ---------------- Salary advance (short-term credit) ----------------
  - id: CRED.SA.001
    layer: credit_policy
    applies_to: {products: [salary_advance]}
    condition: "net_monthly_income >= 3000 and wps_salary == True"
    severity: knockout
    message: "Salary advance: net salary at least AED 3,000 paid through WPS."
    source: "F-52 [A]"
    confidence: M

  - id: CRED.SA.002
    layer: credit_policy
    applies_to: {products: [salary_advance]}
    condition: "loan_amount <= min(0.50 * net_monthly_income, 5000)"
    severity: knockout
    direction: max
    limit: {pct_of_net_salary: 50, max_aed: 5000}
    message: "Salary advance above 50% of net salary or AED 5,000."
    source: "F-52 [A]"
    confidence: M

  - id: CRED.SA.003
    layer: credit_policy
    applies_to: {products: [salary_advance]}
    condition: "term_days <= 35"
    severity: knockout
    direction: max
    limit: 35
    message: "Salary advance repaid in one payment within 35 days."
    source: "F-52 [A]"
    confidence: M

  - id: CRED.SA.004
    layer: credit_policy
    applies_to: {products: [salary_advance]}
    condition: "advances_last_12m < 6 and advances_outstanding == 0 and current_dpd == 0"
    severity: knockout
    message: "Salary advance: max 6 a year, one at a time (no rollover), no arrears."
    source: "F-52 [A]"
    confidence: M

  - id: CRED.SA.005a
    layer: credit_policy
    applies_to: {products: [salary_advance], advance_band: up_to_1000}
    condition: "advance_fee_aed <= 30"
    severity: knockout
    direction: max
    limit: 30
    message: "Salary advance up to AED 1,000: flat fee above AED 30."
    source: "F-52 [A]"
    confidence: M

  - id: CRED.SA.005b
    layer: credit_policy
    applies_to: {products: [salary_advance], advance_band: from_1001_to_2500}
    condition: "advance_fee_aed <= 60"
    severity: knockout
    direction: max
    limit: 60
    message: "Salary advance AED 1,001-2,500: flat fee above AED 60."
    source: "F-52 [A]"
    confidence: M

  - id: CRED.SA.005c
    layer: credit_policy
    applies_to: {products: [salary_advance], advance_band: from_2501_to_5000}
    condition: "advance_fee_aed <= 120"
    severity: knockout
    direction: max
    limit: 120
    message: "Salary advance AED 2,501-5,000: flat fee above AED 120."
    source: "F-52 [A]"
    confidence: M

  - id: CRED.SA.006
    layer: credit_policy
    applies_to: {products: [salary_advance]}
    condition: "late_payment_fee_aed <= 50"
    severity: knockout
    direction: max
    limit: 50
    message: "Salary advance: one late fee of at most AED 50."
    source: "F-52 [A]"
    confidence: M

  # ---------------- BNPL (phase 2; product disabled until launch) ----------------
  - id: CRED.BNPL.001
    layer: credit_policy
    applies_to: {products: [bnpl]}
    condition: "loan_amount <= min(10000, net_monthly_income)"
    severity: knockout
    direction: max
    limit: {max_aed: 10000, net_income_multiple: 1}
    message: "BNPL above the lower of AED 10,000 or 1x net monthly income."
    source: "F-53 [A]"
    confidence: M

  - id: CRED.BNPL.002
    layer: credit_policy
    applies_to: {products: [bnpl]}
    condition: "tenor_months <= 6"
    severity: knockout
    direction: max
    limit: 6
    message: "BNPL longer than 6 months."
    source: "F-53 [A]"
    confidence: M

  - id: CRED.BNPL.003
    layer: credit_policy
    applies_to: {products: [bnpl]}
    condition: "late_fee_per_instalment_aed <= 50 and total_fees_aed <= 0.10 * loan_amount"
    severity: knockout
    message: "BNPL late fee above AED 50 per instalment or total fees above 10%."
    source: "F-53 [A]"
    confidence: M

  - id: CRED.BNPL.004
    layer: credit_policy
    applies_to: {products: [bnpl]}
    condition: "bnpl_active_plans < 3"
    severity: knockout
    direction: max
    limit: 3
    message: "Maximum 3 active BNPL plans."
    source: "F-53 [A]"
    confidence: M

  # ---------------- Home finance (not offered; phase 2 gate) ----------------
  - id: CRED.HL.001
    layer: credit_policy
    applies_to: {products: [home_loan]}
    condition: "mortgage_finance_licence == True"
    severity: knockout
    message: "Home finance needs a mortgage-finance licence and a CBUAE no-objection letter (phase 2)."
    source: "F-55 [A]"
    confidence: H

  # ---------------- Company fee tariff (tighter than CBUAE for auto) ----------------
  - id: CRED.FEE.001
    layer: credit_policy
    applies_to: {products: [personal_loan_employer_assigned, personal_loan_non_assigned, auto_loan, gold_backed]}
    condition: "late_payment_fee_aed <= min(max(0.02 * overdue_instalment, 50), 200)"
    severity: knockout
    direction: max
    limit: {pct_of_overdue_instalment: 2, min_aed: 50, max_aed: 200}
    message: "Late fee above 2% of the overdue instalment (min AED 50, max AED 200, + VAT)."
    source: "F-26 / F-48 [C] [B]"
    confidence: M

  # ---------------- Grade decision (model escalation; policy always wins) ----------------
  - id: CRED.GRD.001
    layer: credit_policy
    applies_to: {products: all}
    condition: "grade <= 6"
    severity: refer
    message: "Model escalation: AI grade 7-8, refer to the Chief Risk Officer (policy passed)."
    source: "F-56 [B]"
    confidence: H

  - id: CRED.GRD.002
    layer: credit_policy
    applies_to: {products: all}
    condition: "grade <= 8"
    severity: knockout
    message: "AI grade 9-10: decline."
    source: "F-56 [B]"
    confidence: H
